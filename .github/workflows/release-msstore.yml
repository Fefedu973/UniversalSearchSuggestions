name: 1. Submit to Microsoft Store

# This is the FIRST step of a release. It builds an unsigned MSIX bundle stamped with
# the Store-assigned Publisher, then uploads it to Partner Center via msstore-cli.
#
# Microsoft then certifies the package and signs it with their own certificate.
# Once Partner Center marks the submission as "Published", run the second workflow
# ("2. Mirror Store release to GitHub + WinGet") to download the Microsoft-signed MSIX.

on:
  workflow_dispatch:
    inputs:
      version:
        description: App package version to publish, e.g. 1.1.0.0. Leave empty to use AppxPackageVersion from the .csproj. The Microsoft Store may auto-stamp the outer bundle with its own date-like version.
        required: false
        type: string

env:
  EXTENSION_NAME: UniversalSearchSuggestions
  PROJECT_DIR: UniversalSearchSuggestions

jobs:
  build-and-submit:
    runs-on: windows-2022

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required configuration
        env:
          MSSTORE_CLIENT_SECRET: ${{ secrets.MSSTORE_CLIENT_SECRET }}
        run: |
          $missing = @()

          if (-not '${{ vars.MSSTORE_TENANT_ID }}'.Trim())   { $missing += 'vars.MSSTORE_TENANT_ID' }
          if (-not '${{ vars.MSSTORE_SELLER_ID }}'.Trim())   { $missing += 'vars.MSSTORE_SELLER_ID' }
          if (-not '${{ vars.MSSTORE_CLIENT_ID }}'.Trim())   { $missing += 'vars.MSSTORE_CLIENT_ID' }
          if (-not '${{ vars.MSSTORE_PRODUCT_ID }}'.Trim())  { $missing += 'vars.MSSTORE_PRODUCT_ID' }
          if (-not '${{ vars.STORE_PUBLISHER_ID }}'.Trim())  { $missing += 'vars.STORE_PUBLISHER_ID' }
          if (-not $env:MSSTORE_CLIENT_SECRET)               { $missing += 'secrets.MSSTORE_CLIENT_SECRET' }

          if ($missing.Count -gt 0) {
            Write-Error "Missing required Actions configuration: $($missing -join ', ')"
            exit 1
          }

          $pub = '${{ vars.STORE_PUBLISHER_ID }}'
          if (-not $pub.StartsWith('CN=')) {
            Write-Error "vars.STORE_PUBLISHER_ID must start with 'CN='; current value: '$pub'"
            exit 1
          }

          Write-Host "All required vars and secrets are set."
        shell: pwsh

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - name: Resolve version
        id: version
        run: |
          $ErrorActionPreference = 'Stop'

          if ("${{ inputs.version }}" -ne "") {
            $version = "${{ inputs.version }}"
          } else {
            $projectFile = "${{ env.PROJECT_DIR }}\${{ env.EXTENSION_NAME }}.csproj"
            $xml = [xml](Get-Content $projectFile)
            $version = $xml.Project.PropertyGroup.AppxPackageVersion | Select-Object -First 1
          }

          if (-not $version) {
            throw "Version was not provided and AppxPackageVersion was not found."
          }

          try {
            $parsedVersion = [version]$version
          } catch {
            throw "Invalid package version '$version'. Expected format like 1.1.0.0."
          }

          # Microsoft Store packages should keep the 4th component at 0.
          # The Store may later stamp the outer bundle with its own date-like version.
          if ($parsedVersion.Revision -ne 0) {
            throw "The 4th version component must be 0 for Microsoft Store packages. Current version: $version"
          }

          "VERSION=$version" >> $env:GITHUB_OUTPUT
          Write-Host "App package version: $version"
        shell: pwsh

      - name: Stamp Package.appxmanifest with Store Version + Publisher
        run: |
          $ErrorActionPreference = 'Stop'

          $manifestPath = "${{ env.PROJECT_DIR }}\Package.appxmanifest"

          [xml]$manifest = Get-Content $manifestPath

          $ns = New-Object System.Xml.XmlNamespaceManager($manifest.NameTable)
          $ns.AddNamespace("ns", "http://schemas.microsoft.com/appx/manifest/foundation/windows10")

          $identity = $manifest.SelectSingleNode("/ns:Package/ns:Identity", $ns)
          if (-not $identity) {
            throw "Could not find /Package/Identity in $manifestPath"
          }

          $identity.Version   = "${{ steps.version.outputs.VERSION }}"
          $identity.Publisher = "${{ vars.STORE_PUBLISHER_ID }}"

          $manifest.Save((Resolve-Path $manifestPath))

          Write-Host "Stamped manifest:"
          Write-Host "  Version   = $($identity.Version)"
          Write-Host "  Publisher = $($identity.Publisher)"
        shell: pwsh

      - name: Build MSIX bundle x64 + ARM64 for Store
        id: build
        run: |
          $ErrorActionPreference = 'Stop'

          $version = "${{ steps.version.outputs.VERSION }}"
          $project = "${{ env.PROJECT_DIR }}\${{ env.EXTENSION_NAME }}.csproj"

          $artifacts = "${{ github.workspace }}\artifacts-store"
          $bundleInput = Join-Path $artifacts "bundle-input"
          $bundlePath = Join-Path $artifacts "${{ env.EXTENSION_NAME }}_$version.msixbundle"

          $uploadDir = Join-Path $artifacts "store-upload"
          $uploadStaging = Join-Path $artifacts "store-upload-staging"
          $uploadPath = Join-Path $uploadDir "${{ env.EXTENSION_NAME }}_$version.msixupload"

          if (Test-Path $artifacts) {
            Remove-Item $artifacts -Recurse -Force
          }

          New-Item -ItemType Directory -Path $artifacts -Force | Out-Null
          New-Item -ItemType Directory -Path $bundleInput -Force | Out-Null
          New-Item -ItemType Directory -Path $uploadDir -Force | Out-Null
          New-Item -ItemType Directory -Path $uploadStaging -Force | Out-Null

          function Show-Tree($path) {
            Write-Host ""
            Write-Host "============================================================"
            Write-Host "FILE TREE: $path"
            Write-Host "============================================================"

            if (Test-Path $path) {
              cmd /c tree /F /A "$path"
            } else {
              Write-Host "Path does not exist: $path"
            }
          }

          function Get-MakeAppx {
            $cmd = Get-Command makeappx.exe -ErrorAction SilentlyContinue
            if ($cmd) {
              return $cmd.Source
            }

            $candidates = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" `
              -Recurse `
              -Filter makeappx.exe `
              -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match '\\x64\\makeappx\.exe$|\\x86\\makeappx\.exe$' } |
              Sort-Object FullName -Descending

            if (-not $candidates) {
              throw "makeappx.exe was not found."
            }

            return $candidates[0].FullName
          }

          try {
            foreach ($platform in @("x64", "arm64")) {
              $runtimeIdentifier = "win-$platform"

              Write-Host ""
              Write-Host "============================================================"
              Write-Host "Building $platform MSIX"
              Write-Host "============================================================"

              $platformOut = Join-Path $artifacts $platform
              New-Item -ItemType Directory -Path $platformOut -Force | Out-Null

              msbuild $project `
                /t:Restore `
                /p:Configuration=Release `
                /p:Platform=$platform `
                /p:RuntimeIdentifier=$runtimeIdentifier

              if ($LASTEXITCODE -ne 0) {
                throw "Restore failed for $platform with exit code $LASTEXITCODE."
              }

              msbuild $project `
                /t:Build `
                /p:Configuration=Release `
                /p:Platform=$platform `
                /p:RuntimeIdentifier=$runtimeIdentifier `
                /p:GenerateAppxPackageOnBuild=true `
                /p:AppxBundle=Never `
                /p:AppxPackageSigningEnabled=false `
                /p:AppxPackageVersion=$version `
                /p:AppxPackagePublisher="${{ vars.STORE_PUBLISHER_ID }}" `
                /p:AppxPackageDir="$platformOut\"

              if ($LASTEXITCODE -ne 0) {
                throw "Build failed for $platform with exit code $LASTEXITCODE."
              }

              $msix = Get-ChildItem -Path $platformOut -Recurse -File -Filter "*.msix" |
                Where-Object {
                  $_.Name -notlike "Microsoft.WindowsAppRuntime*" -and
                  $_.FullName -notmatch "\\Dependencies\\"
                } |
                Sort-Object LastWriteTime -Descending |
                Select-Object -First 1

              if (-not $msix) {
                throw "No app .msix produced for $platform."
              }

              Write-Host "$platform package: $($msix.FullName)"

              Copy-Item $msix.FullName -Destination (Join-Path $bundleInput $msix.Name) -Force
            }

            Write-Host ""
            Write-Host "============================================================"
            Write-Host "Creating MSIX bundle"
            Write-Host "============================================================"

            $makeappx = Get-MakeAppx
            Write-Host "Using MakeAppx: $makeappx"

            if (Test-Path $bundlePath) {
              Remove-Item $bundlePath -Force
            }

            & $makeappx bundle /d $bundleInput /p $bundlePath /bv $version /o

            if ($LASTEXITCODE -ne 0) {
              throw "MakeAppx bundle failed with exit code $LASTEXITCODE."
            }

            if (-not (Test-Path $bundlePath)) {
              throw "MSIX bundle was not produced: $bundlePath"
            }

            Write-Host "MSIX bundle produced: $bundlePath"

            Copy-Item $bundlePath -Destination (Join-Path $uploadStaging (Split-Path $bundlePath -Leaf)) -Force

            Write-Host ""
            Write-Host "============================================================"
            Write-Host "Creating MSIX upload package"
            Write-Host "============================================================"

            # Partner Center rejects .msixsym/.appxsym files inside this manually-created .msixupload.
            # Keep the Store upload package strict: only the .msixbundle goes inside it.
            Get-ChildItem -Path $uploadStaging -Recurse -File -Include "*.msixsym","*.appxsym" -ErrorAction SilentlyContinue |
              Remove-Item -Force

            $unexpectedFiles = Get-ChildItem -Path $uploadStaging -Recurse -File |
              Where-Object { $_.Extension -notin @(".msixbundle") }

            if ($unexpectedFiles) {
              Write-Host "Unexpected files in upload staging:"
              $unexpectedFiles | Format-Table FullName, Length -AutoSize
              throw "Upload staging contains unsupported files. The .msixupload should contain only the .msixbundle."
            }

            $zipPath = "$uploadPath.zip"

            if (Test-Path $zipPath) {
              Remove-Item $zipPath -Force
            }

            if (Test-Path $uploadPath) {
              Remove-Item $uploadPath -Force
            }

            Compress-Archive -Path (Join-Path $uploadStaging "*") -DestinationPath $zipPath -Force
            Move-Item $zipPath $uploadPath -Force

            if (-not (Test-Path $uploadPath)) {
              throw "MSIX upload package was not produced: $uploadPath"
            }

            Add-Type -AssemblyName System.IO.Compression.FileSystem

            $zip = [System.IO.Compression.ZipFile]::OpenRead($uploadPath)
            try {
              $entries = $zip.Entries | Select-Object -ExpandProperty FullName

              Write-Host "MSIXUPLOAD contents:"
              $entries | ForEach-Object { Write-Host "  $_" }

              if ($entries | Where-Object { $_ -like "*.msixsym" -or $_ -like "*.appxsym" }) {
                throw "The .msixupload contains symbol files, which Partner Center rejects."
              }

              if (-not ($entries | Where-Object { $_ -like "*.msixbundle" })) {
                throw "The .msixupload does not contain a .msixbundle."
              }
            } finally {
              $zip.Dispose()
            }

            "MSIX_BUNDLE_PATH=$bundlePath" >> $env:GITHUB_OUTPUT
            "STORE_PACKAGE_PATH=$uploadPath" >> $env:GITHUB_OUTPUT

            Write-Host "Raw MSIX bundle:      $bundlePath"
            Write-Host "Store upload package: $uploadPath"

            if ($bundlePath -notlike "*.msixbundle") {
              throw "Expected .msixbundle, got: $bundlePath"
            }

            if ($uploadPath -notlike "*.msixupload") {
              throw "Expected .msixupload, got: $uploadPath"
            }
          }
          finally {
            Write-Host ""
            Write-Host "============================================================"
            Write-Host "BUILD OUTPUT DIAGNOSTICS"
            Write-Host "============================================================"

            Show-Tree "$artifacts"

            Write-Host ""
            Write-Host "============================================================"
            Write-Host "FOUND PACKAGE-LIKE FILES"
            Write-Host "============================================================"

            $packages = Get-ChildItem -Path $artifacts -Recurse -File -Include `
              "*.msixupload","*.msixbundle","*.msix","*.msixsym","*.appxupload","*.appxbundle","*.appx","*.appxsym" `
              -ErrorAction SilentlyContinue |
              Sort-Object LastWriteTime -Descending |
              Select-Object FullName, Length, LastWriteTime

            if ($packages) {
              $packages | Format-Table -AutoSize
            } else {
              Write-Host "No package-like files found."
            }
          }
        shell: pwsh

      - name: Verify built package has correct Store identity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Add-Type -AssemblyName System.IO.Compression.FileSystem

          $pkg = '${{ steps.build.outputs.STORE_PACKAGE_PATH }}'
          $expectedPublisher = '${{ vars.STORE_PUBLISHER_ID }}'
          $expectedVersion   = '${{ steps.version.outputs.VERSION }}'

          if (-not (Test-Path $pkg)) {
            throw "Package does not exist: $pkg"
          }

          $bundle = $pkg

          if ($pkg -like '*.msixupload') {
            $unwrap = Join-Path $env:RUNNER_TEMP ('unwrap-' + [guid]::NewGuid())
            New-Item -ItemType Directory $unwrap | Out-Null

            [System.IO.Compression.ZipFile]::ExtractToDirectory($pkg, $unwrap)

            $inner = Get-ChildItem $unwrap -Recurse -File -Include *.msixbundle |
              Sort-Object LastWriteTime -Descending |
              Select-Object -First 1

            if (-not $inner) {
              throw "No .msixbundle found inside .msixupload"
            }

            $bundle = $inner.FullName
            Write-Host "Unwrapped .msixupload -> $bundle"
          }

          if ($bundle -notlike '*.msixbundle') {
            throw "Expected to verify a .msixbundle, got: $bundle"
          }

          $tmp = Join-Path $env:RUNNER_TEMP ('verify-' + [guid]::NewGuid())
          New-Item -ItemType Directory $tmp | Out-Null

          $zip = [System.IO.Compression.ZipFile]::OpenRead($bundle)
          try {
            $entry = $zip.Entries |
              Where-Object { $_.Name -eq 'AppxBundleManifest.xml' -or $_.Name -eq 'AppxManifest.xml' } |
              Select-Object -First 1

            if (-not $entry) {
              throw "No manifest found inside built bundle"
            }

            $manifestFile = Join-Path $tmp $entry.Name
            [System.IO.Compression.ZipFileExtensions]::ExtractToFile($entry, $manifestFile, $true)
          } finally {
            $zip.Dispose()
          }

          [xml]$xml = Get-Content $manifestFile

          $identity = $xml.SelectSingleNode("//*[local-name()='Identity']")
          if (-not $identity) {
            throw "No Identity node found inside bundle manifest."
          }

          # In a bundle manifest, the outer Identity Version can be different from the
          # inner Package Version. The inner Package Version is the app/package version
          # used by the rest of the release pipeline.
          $packageNode = $xml.SelectSingleNode("//*[local-name()='Package'][@Version]")

          $actualVersion = if ($packageNode) {
            $packageNode.GetAttribute('Version')
          } else {
            $identity.GetAttribute('Version')
          }

          $actualPublisher = $identity.GetAttribute('Publisher')

          Write-Host "Built package identity:"
          Write-Host "  Publisher = $actualPublisher  expected: $expectedPublisher"
          Write-Host "  Version   = $actualVersion    expected: $expectedVersion"

          if ($actualPublisher -ne $expectedPublisher) {
            throw "Publisher mismatch! Built=$actualPublisher, Expected=$expectedPublisher. Microsoft Store will reject this submission."
          }

          if ($actualVersion -ne $expectedVersion) {
            throw "Version mismatch! Built=$actualVersion, Expected=$expectedVersion."
          }

          Write-Host "Identity check passed."

      - name: Upload Store packages as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: store-package-${{ steps.version.outputs.VERSION }}
          path: |
            ${{ steps.build.outputs.MSIX_BUNDLE_PATH }}
            ${{ steps.build.outputs.STORE_PACKAGE_PATH }}
          retention-days: 30

      - name: Install Microsoft Store Developer CLI
        uses: microsoft/microsoft-store-apppublisher@v1.3

      - name: Configure msstore-cli
        env:
          MSSTORE_CLIENT_SECRET: ${{ secrets.MSSTORE_CLIENT_SECRET }}
        run: |
          $ErrorActionPreference = 'Stop'

          msstore reconfigure `
            --tenantId "${{ vars.MSSTORE_TENANT_ID }}" `
            --sellerId "${{ vars.MSSTORE_SELLER_ID }}" `
            --clientId "${{ vars.MSSTORE_CLIENT_ID }}" `
            --clientSecret "$env:MSSTORE_CLIENT_SECRET" `
            --verbose
        shell: pwsh

      - name: Publish to Microsoft Store
        run: |
          $ErrorActionPreference = 'Stop'

          $packagePath = "${{ steps.build.outputs.STORE_PACKAGE_PATH }}"
          $version = "${{ steps.version.outputs.VERSION }}"
          $packageFileName = Split-Path $packagePath -Leaf

          if (-not (Test-Path $packagePath)) {
            throw "Store package does not exist: $packagePath"
          }

          if ($packagePath -notlike "*.msixupload") {
            throw "Expected .msixupload for Store CLI upload, got: $packagePath"
          }

          # Important:
          # For WinUI projects, msstore publish uses PublishFileSearchFilterStrategy.OneLevelDown.
          # Therefore the package must be exactly one directory below --inputDirectory.
          $msstoreInputRoot = Join-Path "${{ github.workspace }}" "msstore-input"
          $msstoreInputPackageDir = Join-Path $msstoreInputRoot "package"

          if (Test-Path $msstoreInputRoot) {
            Remove-Item $msstoreInputRoot -Recurse -Force
          }

          New-Item -ItemType Directory -Path $msstoreInputPackageDir -Force | Out-Null

          $submittedPackage = Join-Path $msstoreInputPackageDir $packageFileName
          Copy-Item $packagePath $submittedPackage -Force

          Write-Host "Store package path: $packagePath"
          Write-Host "msstore input root: $msstoreInputRoot"
          Write-Host "Submitted package:  $submittedPackage"

          Write-Host ""
          Write-Host "Input tree submitted to msstore:"
          cmd /c tree /F /A "$msstoreInputRoot"

          Write-Host ""
          Write-Host "msstore publish help:"
          msstore publish --help

          Write-Host ""
          Write-Host "Publishing with --inputDirectory pointing to parent folder..."

          $publishLog = Join-Path $env:RUNNER_TEMP "msstore-publish.log"

          msstore publish "${{ github.workspace }}\${{ env.PROJECT_DIR }}" `
            --inputDirectory "$msstoreInputRoot" `
            --appId "${{ vars.MSSTORE_PRODUCT_ID }}" `
            --verbose 2>&1 |
            Tee-Object -FilePath $publishLog

          if ($LASTEXITCODE -ne 0) {
            throw "msstore publish failed with exit code $LASTEXITCODE."
          }

          $logText = Get-Content $publishLog -Raw

          if ($logText -match "Trying to publish these 0 files") {
            throw "msstore publish did not pick up the input package. It logged: Trying to publish these 0 files."
          }

          if ($logText -notmatch [regex]::Escape($packageFileName)) {
            throw "msstore publish output did not mention the expected package file '$packageFileName'."
          }

          if ($logText -match "msixsym is not supported" -or $logText -match "appxsym is not supported") {
            throw "Partner Center rejected symbol files. The .msixupload must not contain .msixsym or .appxsym files."
          }

          if (
            $logText -match "Submission Status - CommitFailed" -or
            $logText -match "Submission has failed" -or
            $logText -match "InvalidParameterValue" -or
            $logText -match "Package acceptance validation error"
          ) {
            throw "Partner Center submission failed. Check the errors above."
          }

          # Do not fail if older packages are still listed.
          # Partner Center can keep older packages in the same submission/ranking table.
          # Success means the new package was picked up and the commit reached certification/publishing.
          if ($logText -match "Submission commit success") {
            Write-Host "Microsoft Store submission commit succeeded."
          } elseif ($logText -match "Submission Status - Certification" -or $logText -match "Submission Status - Publishing") {
            Write-Host "Microsoft Store submission reached certification/publishing."
          } else {
            Write-Warning "The CLI did not clearly print a final success state. Check Partner Center carefully."
          }

          if ($logText -notmatch [regex]::Escape($version)) {
            Write-Warning "The msstore output did not clearly mention app package version $version. This can be normal if the Store displays the outer bundle version differently."
          }
        shell: pwsh

      - name: Next steps
        run: |
          Write-Host ""
          Write-Host "============================================================"
          Write-Host "  Submitted app package version ${{ steps.version.outputs.VERSION }} to Microsoft Store"
          Write-Host "============================================================"
          Write-Host ""
          Write-Host "Built artifacts:"
          Write-Host "  MSIX bundle:      ${{ steps.build.outputs.MSIX_BUNDLE_PATH }}"
          Write-Host "  Store upload:     ${{ steps.build.outputs.STORE_PACKAGE_PATH }}"
          Write-Host ""
          Write-Host "Next steps:"
          Write-Host "  1. Wait for Microsoft to certify the submission."
          Write-Host "  2. Verify in Partner Center: https://partner.microsoft.com/dashboard"
          Write-Host "  3. Once status is 'Published', run the second workflow:"
          Write-Host "       ""2. Mirror Store release to GitHub + WinGet"""
          Write-Host "     to download the Microsoft-signed MSIX and create the GitHub release."
        shell: pwsh
