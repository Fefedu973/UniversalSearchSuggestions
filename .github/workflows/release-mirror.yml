name: 2. Mirror Store release to GitHub + WinGet

# This is the SECOND step of a release. After Microsoft has certified and published your
# Store submission (1-3 days after running "1. Submit to Microsoft Store"), run this workflow.
#
# It pulls the Microsoft-signed MSIX (or .msixbundle) directly from the Store via the
# third-party Pull-Microsoft-Store action, attaches the file(s) to a GitHub release, and
# crafts + submits a WinGet manifest pointing at those release URLs.
#
# Trade-off accepted: depends on sht2017/Pull-Microsoft-Store@main. The downloaded files
# are Microsoft-signed, so any tampering by the action would invalidate the signature and
# block install - the worst case is a failed download, not malicious code execution.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Optional override of the package version (e.g. 1.0.0.2). Leave empty to use whatever Microsoft Store reports.
        required: false
        type: string
      release_notes:
        description: Release notes for the GitHub release
        required: false
        default: New version published to the Microsoft Store, mirrored to GitHub Releases and WinGet.
        type: string
      submit_winget:
        description: Submit a WinGet manifest update?
        required: false
        default: true
        type: boolean

env:
  EXTENSION_NAME: UniversalSearchSuggestions
  DISPLAY_NAME: Universal Search Suggestions
  WINGET_PACKAGE_ID: Fefedu973.UniversalSearchSuggestions
  PUBLISHER_DISPLAY_NAME: Fefe_du_973
  PUBLISHER_URL: https://github.com/Fefedu973
  GITHUB_USER_NAME: Fefedu973
  GITHUB_REPO: UniversalSearchSuggestions
  GITHUB_REPO_URL: https://github.com/Fefedu973/UniversalSearchSuggestions

permissions:
  contents: write   # required to create the GitHub release

jobs:
  # ============================================================================
  # Job 1: Pull the Microsoft-signed MSIX (single bundle or per-arch files) from
  #        the Store and create a GitHub release with them as assets.
  # ============================================================================
  pull-and-release:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.release_info.outputs.RELEASE_TAG }}
      version: ${{ steps.rename.outputs.STORE_VERSION }}
      asset_kind: ${{ steps.rename.outputs.ASSET_KIND }}
      bundle_url: ${{ steps.release_info.outputs.BUNDLE_URL }}
      x64_url: ${{ steps.release_info.outputs.X64_URL }}
      arm64_url: ${{ steps.release_info.outputs.ARM64_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pull MSIX from Microsoft Store
        uses: sht2017/Pull-Microsoft-Store@main
        with:
          product-id: ${{ vars.MSSTORE_PRODUCT_ID }}
          output-path: ./store-msix

      - name: List downloaded files
        run: |
          ls -lh store-msix
          echo "---"
          file store-msix/* || true

      - name: Rename and classify packages
        id: rename
        run: |
          set -e
          cd store-msix
          shopt -s nullglob

          # The Store CDN names files like:
          #   <PackageName>_<MsCatalogId>_<arch_or_neutral>_~_<FamilyHash>_<UpdateGuid>.msix[bundle]
          # The 2nd token is Microsoft's submission/catalog tracking ID, NOT the package's manifest version
          # (e.g. for v1.0.0.0 on the Store the catalog ID can look like "2026.509.909.0").
          # The TRUTH is the Version attribute on the <Identity> element inside AppxBundleManifest.xml
          # (or AppxManifest.xml for a per-arch .msix). We extract that to drive everything downstream.

          all=( *.msix *.msixbundle )
          if [ ${#all[@]} -eq 0 ]; then
            echo "::error::No .msix or .msixbundle file was downloaded from the Store."
            exit 1
          fi

          # Helper: read Identity Version from inside an .msix(bundle) file.
          # AppxBundleManifest.xml lives at AppxMetadata/AppxBundleManifest.xml in a bundle;
          # AppxManifest.xml is at the root of a single .msix. We search the zip listing for
          # whichever exists and stream its content via `unzip -p`.
          extract_version() {
            local file="$1"
            local manifest_path
            manifest_path=$(unzip -l "$file" 2>/dev/null \
              | awk '{print $NF}' \
              | grep -E '(/|^)(AppxBundleManifest\.xml|AppxManifest\.xml)$' \
              | head -n1)
            if [ -z "$manifest_path" ]; then
              return 1
            fi
            unzip -p "$file" "$manifest_path" 2>/dev/null \
              | grep -oE '<Identity[^>]+Version="[^"]+"' \
              | head -n1 \
              | sed -E 's/.*Version="([^"]+)".*/\1/'
          }

          # Detect the package's real manifest version from the first file, then prune any older
          ALL_VERSIONS=()
          for f in "${all[@]}"; do
            v=$(extract_version "$f" || true)
            if [ -n "$v" ]; then
              echo "  $f -> manifest version $v"
              ALL_VERSIONS+=("$v")
            else
              echo "::warning::Could not read manifest version from $f - dumping zip listing for debug:"
              unzip -l "$f" | sed 's/^/    /'
            fi
          done

          if [ ${#ALL_VERSIONS[@]} -eq 0 ]; then
            echo "::error::Could not extract Identity Version from any downloaded package."
            exit 1
          fi
          STORE_VERSION=$(printf '%s\n' "${ALL_VERSIONS[@]}" | sort -V | uniq | tail -n 1)
          echo "Manifest version: $STORE_VERSION"

          # Prune any file whose internal version is older than the latest
          for f in "${all[@]}"; do
            v=$(extract_version "$f" || true)
            if [ "$v" != "$STORE_VERSION" ]; then
              echo "Removing older: $f (manifest version $v)"
              rm -f -- "$f"
            fi
          done

          # Re-glob after pruning
          bundles=( *.msixbundle )
          msixfiles=( *.msix )

          if [ ${#bundles[@]} -ge 1 ]; then
            # Universal bundle path - one .msixbundle covers all archs
            ASSET_KIND=bundle
            for f in "${bundles[@]}"; do
              new="${{ env.EXTENSION_NAME }}_${STORE_VERSION}.msixbundle"
              mv -v -- "$f" "$new"
            done
          elif [ ${#msixfiles[@]} -ge 1 ]; then
            # Per-arch .msix files (Riri-style)
            ASSET_KIND=per-arch
            for f in "${msixfiles[@]}"; do
              # Extract arch token (3rd underscore-delimited field of the original filename)
              arch=$(echo "$f" | awk -F'_' '{print $3}')
              new="${{ env.EXTENSION_NAME }}_${STORE_VERSION}_${arch}.msix"
              mv -v -- "$f" "$new"
            done
          else
            echo "::error::No installer file remained after filtering."
            exit 1
          fi

          ls -lh
          echo "STORE_VERSION=$STORE_VERSION" >> $GITHUB_OUTPUT
          echo "ASSET_KIND=$ASSET_KIND" >> $GITHUB_OUTPUT

          # Optional sanity check vs user override
          if [ -n "${{ inputs.version }}" ] && [ "${{ inputs.version }}" != "$STORE_VERSION" ]; then
            echo "::warning::Workflow input version ${{ inputs.version }} differs from manifest version $STORE_VERSION. Using manifest value."
          fi

      - name: Verify Microsoft signature
        run: |
          cd store-msix
          for f in *.msix *.msixbundle; do
            [ -e "$f" ] || continue
            if ! unzip -l "$f" | grep -q "AppxSignature.p7x"; then
              echo "::error::$f has no AppxSignature.p7x - Microsoft did not sign this build, aborting."
              exit 1
            fi
            echo "$f: AppxSignature.p7x present"
          done

      - name: Compute release URLs
        id: release_info
        run: |
          VERSION="${{ steps.rename.outputs.STORE_VERSION }}"
          KIND="${{ steps.rename.outputs.ASSET_KIND }}"
          TAG="${{ env.EXTENSION_NAME }}-v${VERSION}"
          BASE="https://github.com/${{ env.GITHUB_USER_NAME }}/${{ env.GITHUB_REPO }}/releases/download/${TAG}"

          echo "RELEASE_TAG=$TAG" >> $GITHUB_OUTPUT
          if [ "$KIND" = "bundle" ]; then
            BUNDLE_URL="${BASE}/${{ env.EXTENSION_NAME }}_${VERSION}.msixbundle"
            echo "BUNDLE_URL=$BUNDLE_URL"  >> $GITHUB_OUTPUT
            echo "X64_URL=$BUNDLE_URL"     >> $GITHUB_OUTPUT
            echo "ARM64_URL=$BUNDLE_URL"   >> $GITHUB_OUTPUT
          else
            X64_URL="${BASE}/${{ env.EXTENSION_NAME }}_${VERSION}_x64.msix"
            ARM64_URL="${BASE}/${{ env.EXTENSION_NAME }}_${VERSION}_arm64.msix"
            echo "BUNDLE_URL=" >> $GITHUB_OUTPUT
            echo "X64_URL=$X64_URL"     >> $GITHUB_OUTPUT
            echo "ARM64_URL=$ARM64_URL" >> $GITHUB_OUTPUT
          fi

          echo "Release tag: $TAG"
          echo "Asset kind:  $KIND"

      - name: Upload installers as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.EXTENSION_NAME }}-msix-${{ steps.rename.outputs.STORE_VERSION }}
          path: |
            store-msix/*.msix
            store-msix/*.msixbundle
          if-no-files-found: error

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.RELEASE_TAG }}
          name: ${{ env.DISPLAY_NAME }} v${{ steps.rename.outputs.STORE_VERSION }}
          body: |
            ## ${{ env.DISPLAY_NAME }} v${{ steps.rename.outputs.STORE_VERSION }}

            ${{ inputs.release_notes }}

            ### Install

            **Microsoft Store (recommended):**

            <a href="https://get.microsoft.com/installer/download/${{ vars.MSSTORE_PRODUCT_ID }}?referrer=appbadge" target="_self">
              <img src="https://get.microsoft.com/images/en-us%20dark.svg" width="200" alt="Get it from Microsoft" />
            </a>

            **Via WinGet:**
            ```
            winget install ${{ env.WINGET_PACKAGE_ID }}
            ```

            **Manual:** download the installer below and double-click.

            ### Notes

            - The installer attached below was pulled directly from the Microsoft Store and is signed by Microsoft. No need to install any developer certificate.
            - Same artifact as what the Store and WinGet serve.

            Repository: ${{ env.GITHUB_REPO_URL }}
          files: |
            store-msix/*.msix
            store-msix/*.msixbundle
          draft: false
          prerelease: false

  # ============================================================================
  # Job 2: Generate WinGet manifest YAMLs from the just-released installer(s)
  #        and submit them as a PR to microsoft/winget-pkgs via wingetcreate.
  # ============================================================================
  publish-winget:
    needs: pull-and-release
    if: ${{ inputs.submit_winget }}
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Download installer artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.EXTENSION_NAME }}-msix-${{ needs.pull-and-release.outputs.version }}
          path: ./installers

      - name: Install wingetcreate
        run: Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
        shell: pwsh

      - name: Inspect installer to extract package metadata
        id: inspect
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.IO.Compression.FileSystem

          # Find the bundle (or first .msix if bundle missing)
          $primary = Get-ChildItem ./installers -Filter *.msixbundle | Select-Object -First 1
          if (-not $primary) {
            $primary = Get-ChildItem ./installers -Filter *.msix | Select-Object -First 1
          }
          if (-not $primary) { throw "No installer found in ./installers" }
          Write-Host "Inspecting: $($primary.FullName)"

          # Extract bundle/package manifest to read Identity Name + Publisher
          $tmp = Join-Path $env:RUNNER_TEMP ('inspect-' + [guid]::NewGuid())
          New-Item -ItemType Directory $tmp | Out-Null
          $zip = [System.IO.Compression.ZipFile]::OpenRead($primary.FullName)
          try {
            $manifestEntry = $zip.Entries | Where-Object { $_.Name -eq 'AppxBundleManifest.xml' -or $_.Name -eq 'AppxManifest.xml' } | Select-Object -First 1
            if (-not $manifestEntry) { throw "No AppxManifest found in installer" }
            $manifestPath = Join-Path $tmp $manifestEntry.Name
            [System.IO.Compression.ZipFileExtensions]::ExtractToFile($manifestEntry, $manifestPath, $true)
          } finally { $zip.Dispose() }

          [xml]$xml = Get-Content $manifestPath
          # Identity element is namespace-qualified; use SelectNodes via local-name()
          $identityNode = $xml.SelectSingleNode("//*[local-name()='Identity']")
          $idName       = $identityNode.GetAttribute('Name')
          $idPublisher  = $identityNode.GetAttribute('Publisher')
          $idVersion    = $identityNode.GetAttribute('Version')

          # PackageFamilyName = <Name>_<PublisherHash>; we can let wingetcreate compute it,
          # OR derive it ourselves with the Win32 PackageFamilyNameFromId function. To keep
          # this lightweight, we'll let wingetcreate auto-fill it via `update --urls`.
          # But for the manifest we craft below we DO need it - compute the publisher hash:
          # https://marcoscannerini.com/article/computing-package-family-name
          # Implementation port (SHA256 of UTF-16LE publisher, take 8 bytes, base32 with custom alphabet):
          $bytes  = [Text.Encoding]::Unicode.GetBytes($idPublisher)
          $sha    = [Security.Cryptography.SHA256]::Create().ComputeHash($bytes)
          $first8 = $sha[0..7]
          # Convert to 64-bit binary string
          $bits = ''
          foreach ($b in $first8) { $bits += [Convert]::ToString($b, 2).PadLeft(8,'0') }
          $bits += '0' # pad to 65 to make it divisible by 5
          # Base32 with Microsoft custom alphabet (0-9, then a-v - excludes l, no l-z mapping)
          $alphabet = '0123456789abcdefghjkmnpqrstvwxyz'
          $hash = ''
          for ($i=0; $i -lt $bits.Length; $i+=5) {
            $chunk = $bits.Substring($i, [Math]::Min(5, $bits.Length-$i)).PadRight(5,'0')
            $hash += $alphabet[[Convert]::ToInt32($chunk,2)]
          }
          $pfn = "$idName" + "_" + $hash

          Write-Host "Identity Name:      $idName"
          Write-Host "Identity Publisher: $idPublisher"
          Write-Host "Identity Version:   $idVersion"
          Write-Host "PackageFamilyName:  $pfn"

          "PFN=$pfn" >> $env:GITHUB_OUTPUT
          "MANIFEST_VERSION=$idVersion" >> $env:GITHUB_OUTPUT

      - name: Submit WinGet manifest (handles both new and update cases)
        env:
          GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN || secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = "${{ needs.pull-and-release.outputs.version }}"
          $kind    = "${{ needs.pull-and-release.outputs.asset_kind }}"

          # Build the --urls argument list.
          # For a universal .msixbundle: one URL declared twice (x64 + arm64) so WinGet picks the right slice.
          # For per-arch .msix: distinct URLs per arch.
          if ($kind -eq 'bundle') {
            $urls = @(
              "${{ needs.pull-and-release.outputs.bundle_url }}|x64",
              "${{ needs.pull-and-release.outputs.bundle_url }}|arm64"
            )
          } else {
            $urls = @(
              "${{ needs.pull-and-release.outputs.x64_url }}|x64",
              "${{ needs.pull-and-release.outputs.arm64_url }}|arm64"
            )
          }

          Write-Host "Submitting WinGet manifest:"
          Write-Host "  Package : ${{ env.WINGET_PACKAGE_ID }}"
          Write-Host "  Version : $version"
          Write-Host "  Kind    : $kind"
          $urls | ForEach-Object { Write-Host "  URL     : $_" }

          # First try `update` (works if the package already exists in winget-pkgs).
          # If update fails (no existing manifest -> first submission), fall back to `new`.
          $args = @('update', '${{ env.WINGET_PACKAGE_ID }}',
                    '--version', $version,
                    '--urls') + $urls + @('--token', $env:GITHUB_TOKEN, '--submit')

          Write-Host ""
          Write-Host "Trying: wingetcreate $($args -join ' ')"
          & .\wingetcreate.exe @args 2>&1 | Tee-Object -FilePath wc.log
          $code = $LASTEXITCODE

          if ($code -ne 0) {
            $log = Get-Content wc.log -Raw
            if ($log -match 'no existing manifests' -or $log -match 'not.*found' -or $log -match 'cannot.*update') {
              Write-Host ""
              Write-Host "Update failed - falling back to first-time submission via 'new'."

              # `wingetcreate new` is interactive. Pipe Enter for prompts (accept defaults),
              # then 'y' for the final submit. This is fragile but works for known-good URLs.
              # If this proves brittle we can switch to crafting YAML by hand + 'submit'.
              $newArgs = @('new') + $urls + @('--out', './manifests', '--token', $env:GITHUB_TOKEN)
              Write-Host "Trying: wingetcreate $($newArgs -join ' ')"
              # Send blank lines + 'y' on stdin to accept all defaults and confirm submission.
              # Number of blank lines is generous to cover all possible prompts.
              ("`r`n" * 30 + "y`r`n") | & .\wingetcreate.exe @newArgs

              if ($LASTEXITCODE -ne 0) { throw "wingetcreate new also failed (exit $LASTEXITCODE)" }

              # Now submit the generated folder
              $submitArgs = @('submit', './manifests', '--token', $env:GITHUB_TOKEN)
              Write-Host "Trying: wingetcreate $($submitArgs -join ' ')"
              & .\wingetcreate.exe @submitArgs
              if ($LASTEXITCODE -ne 0) { throw "wingetcreate submit failed (exit $LASTEXITCODE)" }
            } else {
              throw "wingetcreate update failed unexpectedly (exit $code). See wc.log."
            }
          }

          Write-Host ""
          Write-Host "WinGet PR submitted. Check https://github.com/microsoft/winget-pkgs/pulls?q=${{ env.WINGET_PACKAGE_ID }}"
