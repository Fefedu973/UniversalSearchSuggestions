name: Build Command Palette Extension Installers

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish, for example 1.0.0.0. Leave empty to use the project value.
        required: false
        type: string
      release_notes:
        description: Release notes
        required: false
        default: Latest updates and fixes.
        type: string

env:
  DISPLAY_NAME: Universal Search Suggestions
  EXTENSION_NAME: UniversalSearchSuggestions
  PROJECT_DIR: UniversalSearchSuggestions
  GITHUB_REPO_URL: https://github.com/Fefedu973/UniversalSearchSuggestions

jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
        shell: pwsh

      - name: Resolve version
        id: version
        run: |
          if ("${{ inputs.version }}" -ne "") {
            $version = "${{ inputs.version }}"
          } else {
            $projectFile = "${{ env.PROJECT_DIR }}\${{ env.EXTENSION_NAME }}.csproj"
            $xml = [xml](Get-Content $projectFile)
            $version = $xml.Project.PropertyGroup.AppxPackageVersion | Select-Object -First 1
          }

          if (-not $version) {
            throw "Version was not provided and AppxPackageVersion was not found."
          }

          "VERSION=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $version"
        shell: pwsh

      - name: Build x64 and ARM64 installers
        run: |
          Set-Location "${{ env.PROJECT_DIR }}"
          .\build-exe.ps1 -Configuration Release -Version "${{ steps.version.outputs.VERSION }}" -Platforms @("x64", "arm64")
        shell: pwsh

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.EXTENSION_NAME }}-installers
          path: ${{ env.PROJECT_DIR }}/bin/Release/installer/*.exe
          if-no-files-found: error

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.EXTENSION_NAME }}-v${{ steps.version.outputs.VERSION }}
          name: ${{ env.DISPLAY_NAME }} v${{ steps.version.outputs.VERSION }}
          body: |
            ## ${{ env.DISPLAY_NAME }} ${{ steps.version.outputs.VERSION }}

            ${{ inputs.release_notes }}

            Download the installer for your architecture:

            - x64: `${{ env.EXTENSION_NAME }}-Setup-${{ steps.version.outputs.VERSION }}-x64.exe`
            - ARM64: `${{ env.EXTENSION_NAME }}-Setup-${{ steps.version.outputs.VERSION }}-arm64.exe`

            Repository: ${{ env.GITHUB_REPO_URL }}
          files: ${{ env.PROJECT_DIR }}/bin/Release/installer/*.exe
          draft: false
          prerelease: false
